<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#295643" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" crossorigin="use-credentials" />
    <title>Idea Stream</title>
    <meta name="description" content="A private notebook for ideas: capture by voice, text, and links, then turn them into finished work." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Idea Stream" />
    <meta property="og:description" content="A private notebook for ideas: capture by voice, text, and links, then turn them into finished work." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Idea Stream" />
    <meta name="twitter:description" content="A private notebook for ideas: capture by voice, text, and links, then turn them into finished work." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Idea Stream" />
    <script>
      // Apply the saved theme before anything is drawn (no light flash in dark mode). See src/lib/theme.ts.
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("idea-stream-theme") || "null") || {};
          const dark = saved.mode === "dark" || (saved.mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          if (saved.palette) document.documentElement.dataset.palette = saved.palette;
        } catch {}
      })();
    </script>
    <style>
      html.dark, html.dark body { background: #0e1311; color-scheme: dark; }
      html.dark #startup-status { background: #0e1311 !important; color: #e8e3d6 !important; }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup-status" style="min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;box-sizing:border-box;background:#f7f6f3;color:#243e34;font-family:system-ui,sans-serif">
        <h1 style="font-size:28px;margin:0 0 12px">Idea Stream</h1>
        <p id="startup-message" role="status">Opening your notebook…</p>
        <button id="startup-retry" type="button" hidden style="margin:16px auto;padding:12px 24px;background:#365d4f;color:white;border:0;border-radius:12px;font:inherit;cursor:pointer">Try again</button>
        <noscript>Please enable JavaScript to open your notebook.</noscript>
      </main>
    </div>
    <script>
      (() => {
        const retry = document.getElementById('startup-retry');
        retry.addEventListener('click', () => window.location.reload());
        const showFailure = () => {
          if (!document.getElementById('startup-status')) return;
          document.getElementById('startup-message').textContent = 'Your notebook could not finish opening. Check your connection, then try again.';
          retry.hidden = false;
        };
        window.addEventListener('error', (event) => {
          if (event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement) showFailure();
        }, true);
        setTimeout(showFailure, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
