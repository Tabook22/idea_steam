      properties:
        url:
          type: string
          minLength: 1
          description: Path of the uploaded audio in this app's storage.
        clientCaptureId:
          type: string
          format: uuid
          description: Stable recording ID so a retried upload is saved once.
        mimeType:
          type: string
        durationSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        capturedAt:
          type: string
          format: date-time
        marks:
          type: array
          maxItems: 500
          items:
            type: number
            minimum: 0
