          type: array
          description: The subjects this recording has been added to.
          items:
            $ref: "#/components/schemas/AudioLibrarySubjectLink"
        bakedMusic:
          type: boolean
          description: An older copy made with the music mixed in; its music can still be removed (the voice comes from the recording it was made from).
        mix:
          description: Background music added as a removable layer (null when there is none).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AudioMixLayer"
        title:
          type: [string, "null"]
          description: Set when renamed; otherwise null.
        mimeType:
          type: [string, "null"]
        durationSeconds:
          type: [integer, "null"]
        transcript:
          type: [string, "null"]
        sourceIdeaId:
          type: [integer, "null"]
          description: The idea it came from, if that idea still exists.
        sourceSubjectId:
          type: [integer, "null"]
          description: The idea's current subject, if the idea still exists.
        sourceSubjectTitle:
          type: [string, "null"]
          description: The subject it was first saved in.
        edited:
          type: boolean
          description: True after cutting; the original can be restored.
        hasWords:
          type: boolean
          description: Word timings are already stored, so "Edit by text" opens instantly.
        marks:
          type: array
          description: Seconds where "Mark" was tapped while recording.
          items:
            type: number
        chapters:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/AudioChapter"
        summary:
          type: [string, "null"]
        capturedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
