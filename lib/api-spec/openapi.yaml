openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: subjects
    description: Idea subjects and their note streams
  - name: ideas
    description: Timestamped idea notes
  - name: idea-chat
    description: AI conversations grounded in an individual idea
  - name: compilation
    description: Turning collected ideas into drafts
  - name: transcription
    description: Converting recorded audio into editable text
  - name: Storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List all subjects
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Create a new subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Created subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
  /subjects/{subjectId}:
    get:
      operationId: getSubject
      tags: [subjects]
      summary: Get a subject with its ideas
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectDetail"
        "404":
          description: Subject not found
    patch:
      operationId: updateSubject
      tags: [subjects]
      summary: Update subject metadata
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectUpdate"
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
    delete:
      operationId: deleteSubject
      tags: [subjects]
      summary: Delete a subject and its ideas
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "204":
          description: Deleted
  /subjects/{subjectId}/ideas:
    post:
      operationId: createIdea
      tags: [ideas]
      summary: Add an idea to a subject
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaInput"
      responses:
        "201":
          description: Created idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
    get:
      operationId: listIdeas
      tags: [ideas]
      summary: List ideas for a subject
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
  /ideas/{ideaId}:
    patch:
      operationId: updateIdea
      tags: [ideas]
      summary: Edit an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaUpdate"
      responses:
        "200":
          description: Updated idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
    delete:
      operationId: deleteIdea
      tags: [ideas]
      summary: Delete an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      responses:
        "204":
          description: Deleted
  /ideas/{ideaId}/chat:
    get:
      operationId: listIdeaChatMessages
      tags: [idea-chat]
      summary: List the persistent AI chat for an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdeaChatMessage"
    delete:
      operationId: clearIdeaChat
      tags: [idea-chat]
      summary: Clear the AI chat for an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      responses:
        "204":
          description: Chat cleared
  /ideas/{ideaId}/chat/messages:
    post:
      operationId: sendIdeaChatMessage
      tags: [idea-chat]
      summary: Send a message about an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaChatMessageInput"
      responses:
        "201":
          description: User and assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaChatExchange"
  /subjects/{subjectId}/compile:
    post:
      operationId: compileSubject
      tags: [compilation]
      summary: Compile a subject's ideas into a draft
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompilationInput"
      responses:
        "200":
          description: Compiled draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compilation"
  /transcriptions:
    post:
      operationId: transcribeAudio
      tags: [transcription]
      summary: Convert a voice recording to text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionInput"
      responses:
        "200":
          description: Audio transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
  /note-translations:
    post:
      operationId: translateNote
      tags: [translation]
      summary: Translate an attachment note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteTranslationInput"
      responses:
        "200":
          description: Translated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteTranslation"
  /youtube-transcripts:
    post:
      operationId: extractYoutubeTranscript
      tags: [transcription]
      summary: Extract captions from a YouTube video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeTranscriptInput"
      responses:
        "200":
          description: YouTube transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeTranscript"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
components:
  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: integer
    IdeaId:
      name: ideaId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    TranscriptionInput:
      type: object
      required: [audioBase64, mimeType, language]
      properties:
        audioBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
        language:
          type: string
          enum: [en, ar]
    Transcription:
      type: object
      required: [text]
      properties:
        text:
          type: string
    NoteTranslationInput:
      type: object
      required: [text, targetLanguage]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
        targetLanguage:
          type: string
          enum: [en, ar]
    NoteTranslation:
      type: object
      required: [text, language]
      properties:
        text:
          type: string
        language:
          type: string
          enum: [en, ar]
    YoutubeTranscriptInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    YoutubeTranscript:
      type: object
      required: [text]
      properties:
        text:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Subject:
      type: object
      required: [id, title, intro, createdAt, updatedAt, ideaCount]
      properties:
        id:
          type: integer
        title:
          type: string
        intro:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ideaCount:
          type: integer
    SubjectDetail:
      allOf:
        - $ref: "#/components/schemas/Subject"
        - type: object
          required: [ideas]
          properties:
            ideas:
              type: array
              items:
                $ref: "#/components/schemas/Idea"
            draft:
              type: ["string", "null"]
    SubjectInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        intro:
          type: string
          default: ""
    SubjectUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        intro:
          type: string
        draft:
          type: ["string", "null"]
    IdeaAttachment:
      type: object
      required: [type, url, name]
      properties:
        type:
          type: string
          enum: [image, video, audio, pdf, document, link]
        url:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        mimeType:
          type: string
        note:
          type: string
        transcript:
          type: string
        extractedText:
          type: string
    Idea:
      type: object
      required: [id, subjectId, content, source, attachments, createdAt]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        content:
          type: string
        source:
          type: string
          enum: [text, voice, image, video, audio, pdf, document, link]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAttachment"
        createdAt:
          type: string
          format: date-time
    IdeaChatMessage:
      type: object
      required: [id, ideaId, role, content, createdAt]
      properties:
        id:
          type: integer
        ideaId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    IdeaChatMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
    IdeaChatExchange:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: "#/components/schemas/IdeaChatMessage"
        assistantMessage:
          $ref: "#/components/schemas/IdeaChatMessage"
    IdeaInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
        source:
          type: string
          enum: [text, voice, image, video, audio, pdf, document, link]
          default: text
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAttachment"
          default: []
    IdeaUpdate:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAttachment"
    CompilationInput:
      type: object
      properties:
        tone:
          type: string
          enum: [clear, conversational, academic, cinematic]
          default: clear
    Compilation:
      type: object
      required: [subjectId, title, draft, generatedAt]
      properties:
        subjectId:
          type: integer
        title:
          type: string
        draft:
          type: string
        generatedAt:
          type: string
          format: date-time

