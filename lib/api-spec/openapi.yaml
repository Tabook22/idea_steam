openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: subjects
    description: Idea subjects and their note streams
  - name: ideas
    description: Timestamped idea notes
  - name: idea-chat
    description: AI conversations grounded in an individual idea
  - name: compilation
    description: Turning collected ideas into drafts
  - name: search
    description: Finding ideas, notebooks, and drafts
  - name: audio-library
    description: An independent list of every recording
  - name: transcription
    description: Converting recorded audio into editable text
  - name: Storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List all subjects
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Create a new subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Created subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
  /subjects/{subjectId}:
    get:
      operationId: getSubject
      tags: [subjects]
      summary: Get a subject with its ideas
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectDetail"
        "404":
          description: Subject not found
    patch:
      operationId: updateSubject
      tags: [subjects]
      summary: Update subject metadata
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectUpdate"
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
    delete:
      operationId: deleteSubject
      tags: [subjects]
      summary: Delete a subject and its ideas
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "204":
          description: Deleted
  /subjects/{subjectId}/ideas:
    post:
      operationId: createIdea
      tags: [ideas]
      summary: Add an idea to a subject
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaInput"
      responses:
        "201":
          description: Created idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
    get:
      operationId: listIdeas
      tags: [ideas]
      summary: List ideas for a subject
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
  /ideas/{ideaId}:
    patch:
      operationId: updateIdea
      tags: [ideas]
      summary: Edit an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaUpdate"
      responses:
        "200":
          description: Updated idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
    delete:
      operationId: deleteIdea
      tags: [ideas]
      summary: Delete an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      responses:
        "204":
          description: Deleted
  /ideas/{ideaId}/chat:
    get:
      operationId: listIdeaChatMessages
      tags: [idea-chat]
      summary: List the persistent AI chat for an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdeaChatMessage"
    delete:
      operationId: clearIdeaChat
      tags: [idea-chat]
      summary: Clear the AI chat for an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      responses:
        "204":
          description: Chat cleared
  /ideas/{ideaId}/chat/messages:
    post:
      operationId: sendIdeaChatMessage
      tags: [idea-chat]
      summary: Send a message about an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaChatMessageInput"
      responses:
        "201":
          description: User and assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaChatExchange"
  /subjects/{subjectId}/compile:
    post:
      operationId: compileSubject
      tags: [compilation]
      summary: Compile a subject's ideas into a draft
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompilationInput"
      responses:
        "200":
          description: Compiled draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compilation"
  /subjects/{subjectId}/compilations:
    get:
      operationId: listSubjectCompilations
      tags: [compilation]
      summary: List every compiled draft for a subject
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Compiled drafts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compilation"
  /subjects/{subjectId}/compilations/{compilationId}:
    patch:
      operationId: updateSubjectCompilation
      tags: [compilation]
      summary: Update a compiled draft
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/CompilationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompilationUpdate"
      responses:
        "200":
          description: Updated compiled draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compilation"
        "404":
          description: Compiled draft not found
    delete:
      operationId: deleteSubjectCompilation
      tags: [compilation]
      summary: Delete a compiled draft
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/CompilationId"
      responses:
        "204":
          description: Deleted
  /subjects/{subjectId}/compilations/{compilationId}/download:
    post:
      operationId: downloadSubjectCompilation
      tags: [compilation]
      summary: Download a compiled draft as PDF or DOCX
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/CompilationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompilationDownloadInput"
      responses:
        "200":
          description: Generated document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "404":
          description: Compiled draft not found
  /transcriptions:
    post:
      operationId: transcribeAudio
      tags: [transcription]
      summary: Convert a voice recording to text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionInput"
      responses:
        "200":
          description: Audio transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
  /note-translations:
    post:
      operationId: translateNote
      tags: [translation]
      summary: Translate an attachment note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteTranslationInput"
      responses:
        "200":
          description: Translated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteTranslation"
  /youtube-transcripts:
    post:
      operationId: extractYoutubeTranscript
      tags: [transcription]
      summary: Extract captions from a YouTube video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeTranscriptInput"
      responses:
        "200":
          description: YouTube transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeTranscript"
  /search:
    get:
      operationId: searchWorkspace
      tags: [search]
      summary: Search ideas, transcripts, notebooks, and drafts
      description: Case-insensitive; Arabic letter variants and diacritics are treated as equivalent.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        "200":
          description: Matches, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Query too short or too long
  /audio-library:
    get:
      operationId: listAudioLibrary
      tags: [audio-library]
      summary: List every recording in the audio library, newest first
      responses:
        "200":
          description: Library items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AudioLibraryItem"
    post:
      operationId: addToAudioLibrary
      tags: [audio-library]
      summary: Add an idea's audio attachment to the library (for example, after removing it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioLibraryAdd"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "200":
          description: Already in the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "404":
          description: Idea or audio attachment not found
  /audio-library/recordings:
    post:
      operationId: createLibraryRecording
      tags: [audio-library]
      summary: Save an uploaded recording straight into the library, without an idea in any subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryRecordingInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "200":
          description: Already saved (a retried upload)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "400":
          description: Not a recording stored in this app
  /audio-library/{itemId}/transcription:
    post:
      operationId: transcribeLibraryItem
      tags: [audio-library]
      summary: Convert a library recording to text, keeping the spoken language
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryTranscriptionInput"
      responses:
        "200":
          description: Transcribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "404":
          description: Not in the library
        "422":
          description: No speech detected, or the audio could not be read
  /audio-library/join:
    post:
      operationId: joinAudioLibraryItems
      tags: [audio-library]
      summary: Join recordings, in the given order, into one new library recording
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioJoinInput"
      responses:
        "201":
          description: The new joined recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/edit:
    post:
      operationId: editAudioLibraryItem
      tags: [audio-library]
      summary: Keep only the given parts of a recording; the original is kept for restoring
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioEditInput"
      responses:
        "200":
          description: Edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/words:
    post:
      operationId: getAudioLibraryWords
      tags: [audio-library]
      summary: Every word of the recording with its start and end time (fetched once, then stored)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryTranscriptionInput"
      responses:
        "200":
          description: Words with timings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryWords"
        "404":
          description: Not in the library
  /audio-library/{itemId}/enhance:
    post:
      operationId: enhanceAudioLibraryItem
      tags: [audio-library]
      summary: Reduce background noise and even out loudness; the original is kept for restoring
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioEnhanceInput"
      responses:
        "200":
          description: Improved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/sound-lab:
    post:
      operationId: soundLabAudioLibraryItem
      tags: [audio-library]
      summary: Apply Sound lab settings (noise, hum, bands, boxes, volume) to the whole recording; the original is kept for restoring
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoundLabSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/sound-lab/preview:
    post:
      operationId: previewSoundLabAudioLibraryItem
      tags: [audio-library]
      summary: Render a short stretch with the given settings, to compare before saving (nothing is saved)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoundLabPreviewInput"
      responses:
        "200":
          description: The processed stretch as MP3
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
  /audio-library/{itemId}/mix:
    post:
      operationId: mixAudioLibraryItem
      tags: [audio-library]
      summary: Add background music to a recording; saves the mix as a new library item (the recording is unchanged)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MixInput"
      responses:
        "201":
          description: The new recording with music
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/mix/remove:
    post:
      operationId: removeAudioLibraryMix
      tags: [audio-library]
      summary: Remove the background music; the recording goes back to the voice as it was before
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "200":
          description: The recording without music
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/mix/preview:
    post:
      operationId: previewMixAudioLibraryItem
      tags: [audio-library]
      summary: Render a short stretch of the mix to listen to before saving (nothing is saved)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MixPreviewInput"
      responses:
        "200":
          description: The mixed stretch as MP3
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
  /audio-library/{itemId}/chapters:
    post:
      operationId: makeAudioLibraryChapters
      tags: [audio-library]
      summary: AI chapters (topic titles with start times) and a short summary, in the recording's language
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "200":
          description: The item with chapters and summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/export:
    get:
      operationId: exportAudioLibraryItem
      tags: [audio-library]
      summary: Download the recording converted to another format (the stored recording is unchanged)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [mp3, wav, m4a, ogg, opus, flac]
        - name: quality
          in: query
          required: false
          schema:
            type: string
            enum: [standard, high, best]
            default: high
      responses:
        "200":
          description: The converted audio file
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "404":
          description: Not in the library
  /audio-library/{itemId}/restore:
    post:
      operationId: restoreAudioLibraryItem
      tags: [audio-library]
      summary: Undo all edits and go back to the original recording
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "409":
          description: Not edited
  /audio-library/{itemId}:
    patch:
      operationId: updateAudioLibraryItem
      tags: [audio-library]
      summary: Rename an item or record its measured length
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioLibraryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "404":
          description: Not found
    delete:
      operationId: deleteAudioLibraryItem
      tags: [audio-library]
      summary: Remove an item from the library only; the idea and its audio are untouched
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "204":
          description: Removed from the library
        "404":
          description: Not found
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
components:
  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: integer
    IdeaId:
      name: ideaId
      in: path
      required: true
      schema:
        type: integer
    AudioLibraryItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    CompilationId:
      name: compilationId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
        purpose:
          type: string
          enum: [compiled-draft-image]
        compilationId:
          type: integer
          minimum: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    TranscriptionInput:
      type: object
      required: [audioBase64, mimeType, language]
      properties:
        audioBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
        language:
          type: string
          enum: [en, ar]
    Transcription:
      type: object
      required: [text]
      properties:
        text:
          type: string
    NoteTranslationInput:
      type: object
      required: [text, targetLanguage]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
        targetLanguage:
          type: string
          enum: [en, ar]
    NoteTranslation:
      type: object
      required: [text, language]
      properties:
        text:
          type: string
        language:
          type: string
          enum: [en, ar]
    YoutubeTranscriptInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    YoutubeTranscript:
      type: object
      required: [text]
      properties:
        text:
          type: string
    SearchIdeaHit:
      type: object
      required: [id, subjectId, subjectTitle, source, snippet, matchedIn, createdAt]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        subjectTitle:
          type: string
        source:
          type: string
        snippet:
          type: string
          description: Text around the first match.
        matchedIn:
          type: string
          enum: [content, transcript, note, attachment]
        createdAt:
          type: string
          format: date-time
    SearchSubjectHit:
      type: object
      required: [id, title, snippet, ideaCount]
      properties:
        id:
          type: integer
        title:
          type: string
        snippet:
          type: string
        ideaCount:
          type: integer
    SearchDraftHit:
      type: object
      required: [id, subjectId, subjectTitle, tone, snippet, updatedAt]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        subjectTitle:
          type: string
        tone:
          type: string
        snippet:
          type: string
        updatedAt:
          type: string
          format: date-time
    SearchResults:
      type: object
      required: [query, ideas, subjects, drafts]
      properties:
        query:
          type: string
        ideas:
          type: array
          items:
            $ref: "#/components/schemas/SearchIdeaHit"
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/SearchSubjectHit"
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/SearchDraftHit"
    AudioLibraryItem:
      type: object
      required: [id, url, title, mimeType, durationSeconds, transcript, sourceIdeaId, sourceSubjectId, sourceSubjectTitle, edited, hasWords, marks, chapters, summary, kind, mix, capturedAt, createdAt]
      properties:
        id:
          type: integer
        url:
          type: string
        kind:
          type: string
          enum: [recording, music]
          description: music = a song uploaded to use as background music.
        mix:
          description: Background music added as a removable layer (null when there is none).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AudioMixLayer"
        title:
          type: [string, "null"]
          description: Set when renamed; otherwise null.
        mimeType:
          type: [string, "null"]
        durationSeconds:
          type: [integer, "null"]
        transcript:
          type: [string, "null"]
        sourceIdeaId:
          type: [integer, "null"]
          description: The idea it came from, if that idea still exists.
        sourceSubjectId:
          type: [integer, "null"]
          description: The idea's current subject, if the idea still exists.
        sourceSubjectTitle:
          type: [string, "null"]
          description: The subject it was first saved in.
        edited:
          type: boolean
          description: True after cutting; the original can be restored.
        hasWords:
          type: boolean
          description: Word timings are already stored, so "Edit by text" opens instantly.
        marks:
          type: array
          description: Seconds where "Mark" was tapped while recording.
          items:
            type: number
        chapters:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/AudioChapter"
        summary:
          type: [string, "null"]
        capturedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    LibraryRecordingInput:
      type: object
      required: [url, clientCaptureId]
      properties:
        url:
          type: string
          minLength: 1
          description: Path of the uploaded audio in this app's storage.
        clientCaptureId:
          type: string
          format: uuid
          description: Stable recording ID so a retried upload is saved once.
        mimeType:
          type: string
        durationSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        capturedAt:
          type: string
          format: date-time
        marks:
          type: array
          maxItems: 100
          items:
            type: number
            minimum: 0
        title:
          type: string
          maxLength: 200
        kind:
          type: string
          enum: [recording, music]
          default: recording
    LibraryTranscriptionInput:
      type: object
      properties:
        language:
          type: string
          enum: [auto, en, ar]
          default: auto
    TimedWord:
      type: object
      required: [word, start, end]
      properties:
        word:
          type: string
        start:
          type: number
        end:
          type: number
    AudioLibraryWords:
      type: object
      required: [text, words]
      properties:
        text:
          type: string
        words:
          type: array
          items:
            $ref: "#/components/schemas/TimedWord"
    AudioEnhanceInput:
      type: object
      properties:
        denoise:
          type: boolean
          default: true
          description: Remove low rumble and steady background noise.
        level:
          type: boolean
          default: true
          description: Even out loudness to a comfortable listening level.
    SoundLabRegionEdit:
      type: object
      required: [start, end, low, high, gain]
      properties:
        start: { type: number, minimum: 0 }
        end: { type: number, minimum: 0 }
        low: { type: number, minimum: 20, maximum: 24000 }
        high: { type: number, minimum: 20, maximum: 24000 }
        gain: { type: number, minimum: -40, maximum: 12 }
    SoundLabSettings:
      type: object
      required: [noise, bands, edits, volume, level, deess]
      properties:
        noise:
          type: integer
          minimum: 0
          maximum: 4
          description: Noise reduction, 0 (off) to 4 (maximum).
        noiseSample:
          type: [object, "null"]
          required: [start, end]
          properties:
            start: { type: number, minimum: 0 }
            end: { type: number, minimum: 0 }
        noiseFloor:
          type: [number, "null"]
          minimum: -120
          maximum: 0
          description: Measured loudness of the background noise (RMS dBFS). Measured on the server when missing.
        hum:
          type: [integer, "null"]
          enum: [50, 60, null]
        bands:
          type: object
          required: [rumble, warmth, voice, presence, air]
          properties:
            rumble: { type: number, minimum: -30, maximum: 12 }
            warmth: { type: number, minimum: -30, maximum: 12 }
            voice: { type: number, minimum: -30, maximum: 12 }
            presence: { type: number, minimum: -30, maximum: 12 }
            air: { type: number, minimum: -30, maximum: 12 }
        edits:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/SoundLabRegionEdit"
        volume: { type: number, minimum: -12, maximum: 12 }
        level: { type: boolean }
        deess: { type: boolean }
    SoundLabPreviewInput:
      type: object
      required: [settings, start]
      properties:
        settings:
          $ref: "#/components/schemas/SoundLabSettings"
        start: { type: number, minimum: 0 }
        seconds: { type: number, minimum: 3, maximum: 30, default: 15 }
    MixSettings:
      type: object
      required: [musicStart, regionStart, regionEnd, fit, musicVolume, voiceVolume, fadeIn, fadeOut, duck, makeRoom]
      properties:
        musicStart:
          type: number
          minimum: 0
          description: Where in the song to begin (seconds).
        regionStart:
          type: number
          minimum: -60
          maximum: 86400
          description: Where the music starts, on the recording's clock (negative = an intro before the voice).
        regionEnd:
          type: number
          minimum: -59
          maximum: 86460
          description: Where the music ends, on the recording's clock (past the end = an outro).
        fit:
          type: string
          enum: [loop, stretch, once]
          description: How the song fills the time between start and end.
        musicVolume: { type: number, minimum: -40, maximum: 6 }
        voiceVolume: { type: number, minimum: -12, maximum: 12 }
        fadeIn: { type: number, minimum: 0, maximum: 15 }
        fadeOut: { type: number, minimum: 0, maximum: 15 }
        duck:
          type: integer
          minimum: 0
          maximum: 3
          description: Lower the music while the voice speaks, 0 (off) to 3 (strong).
        makeRoom:
          type: boolean
          description: Dip the music's middle frequencies so words stay clear.
    AudioMixLayer:
      type: object
      required: [voiceUrl, musicItemId, musicUrl, musicTitle, pre, settings]
      properties:
        voiceUrl:
          type: string
          description: The voice-only audio underneath the music.
        musicUrl:
          type: string
          description: The song's audio (kept even if the song is later removed from the library).
        musicItemId: { type: [integer, "null"] }
        musicTitle: { type: [string, "null"] }
        pre:
          type: number
          description: Seconds of music before the voice starts.
        settings:
          $ref: "#/components/schemas/MixSettings"
    MixInput:
      type: object
      required: [musicItemId, settings]
      properties:
        target:
          type: string
          enum: [same, copy]
          default: copy
          description: same = put the music on this recording (removable later); copy = save the mix as a new recording.
        musicItemId: { type: integer }
        settings:
          $ref: "#/components/schemas/MixSettings"
        title:
          type: string
          maxLength: 200
    MixPreviewInput:
      type: object
      required: [musicItemId, settings, start]
      properties:
        musicItemId: { type: integer }
        settings:
          $ref: "#/components/schemas/MixSettings"
        start: { type: number, minimum: 0 }
        seconds: { type: number, minimum: 3, maximum: 30, default: 15 }
    AudioChapter:
      type: object
      required: [start, title]
      properties:
        start:
          type: number
        title:
          type: string
    AudioRange:
      type: object
      required: [start, end]
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
    AudioEditInput:
      type: object
      required: [keep]
      properties:
        keep:
          type: array
          minItems: 1
          maxItems: 200
          description: Parts to keep, in seconds, in order and not overlapping.
          items:
            $ref: "#/components/schemas/AudioRange"
    AudioJoinInput:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: integer
        title:
          type: string
          maxLength: 200
    AudioLibraryAdd:
      type: object
      required: [ideaId]
      properties:
        ideaId:
          type: integer
        attachmentIndex:
          type: integer
          minimum: 0
          default: 0
    AudioLibraryUpdate:
      type: object
      properties:
        title:
          type: [string, "null"]
          maxLength: 200
        durationSeconds:
          type: integer
          minimum: 0
          maximum: 86400
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Subject:
      type: object
      required: [id, title, intro, createdAt, updatedAt, ideaCount]
      properties:
        id:
          type: integer
        title:
          type: string
        intro:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ideaCount:
          type: integer
    SubjectDetail:
      allOf:
        - $ref: "#/components/schemas/Subject"
        - type: object
          required: [ideas]
          properties:
            ideas:
              type: array
              items:
                $ref: "#/components/schemas/Idea"
    SubjectInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        intro:
          type: string
          default: ""
    SubjectUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        intro:
          type: string
    IdeaAttachment:
      type: object
      required: [type, url, name]
      properties:
        type:
          type: string
          enum: [image, video, audio, pdf, document, link]
        url:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        mimeType:
          type: string
        note:
          type: string
        transcript:
          type: string
        extractedText:
          type: string
        durationSeconds:
          type: integer
          minimum: 0
          description: Length of an audio recording, when known.
        marks:
          type: array
          maxItems: 100
          description: Seconds where "Mark" was tapped while recording.
          items:
            type: number
            minimum: 0
    Idea:
      type: object
      required: [id, subjectId, content, source, attachments, createdAt]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        content:
          type: string
        source:
          type: string
          enum: [text, voice, image, video, audio, pdf, document, link]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAttachment"
        createdAt:
          type: string
          format: date-time
    IdeaChatMessage:
      type: object
      required: [id, ideaId, role, content, createdAt]
      properties:
        id:
          type: integer
        ideaId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    IdeaChatMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
    IdeaChatExchange:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: "#/components/schemas/IdeaChatMessage"
        assistantMessage:
          $ref: "#/components/schemas/IdeaChatMessage"
    IdeaInput:
      type: object
      required: [content]
      properties:
        clientCaptureId:
          type: string
          format: uuid
          description: Stable recording ID for idempotent retries.
        capturedAt:
          type: string
          format: date-time
          description: Original capture time for delayed uploads.
        content:
          type: string
          minLength: 1
        source:
          type: string
          enum: [text, voice, image, video, audio, pdf, document, link]
          default: text
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAttachment"
          default: []
    IdeaUpdate:
      type: object
      properties:
        subjectId:
          type: integer
          minimum: 1
          description: Move the idea and its attachments to this subject.
        content:
          type: string
          minLength: 1
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAttachment"
    CompilationInput:
      type: object
      properties:
        tone:
          type: string
          enum:
            - clear
            - conversational
            - academic
            - cinematic
            - newspaper_article
            - advertisement
            - discussion_invitation
            - official_letter
            - masters_proposal
            - phd_proposal
            - summary_only
            - objectives_goals
            - youtube_script
            - broadcast_script
          default: clear
    Compilation:
      type: object
      required: [id, subjectId, tone, content, createdAt, updatedAt]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        tone:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CompilationUpdate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
    CompilationDownloadInput:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [pdf, docx]
