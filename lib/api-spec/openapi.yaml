openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: subjects
    description: Idea subjects and their note streams
  - name: ideas
    description: Timestamped idea notes
  - name: idea-chat
    description: AI conversations grounded in an individual idea
  - name: compilation
    description: Turning collected ideas into drafts
  - name: meetings
    description: Recorded meetings with speakers and minutes
  - name: tasks
    description: Tasks found in recordings or added by hand
  - name: search
    description: Finding ideas, notebooks, and drafts
  - name: audio-library
    description: An independent list of every recording
  - name: transcription
    description: Converting recorded audio into editable text
  - name: Storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List all subjects
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Create a new subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Created subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
  /subjects/{subjectId}:
    get:
      operationId: getSubject
      tags: [subjects]
      summary: Get a subject with its ideas
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectDetail"
        "404":
          description: Subject not found
    patch:
      operationId: updateSubject
      tags: [subjects]
      summary: Update subject metadata
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectUpdate"
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
    delete:
      operationId: deleteSubject
      tags: [subjects]
      summary: Delete a subject and its ideas
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "204":
          description: Deleted
  /subjects/{subjectId}/ideas:
    post:
      operationId: createIdea
      tags: [ideas]
      summary: Add an idea to a subject
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaInput"
      responses:
        "201":
          description: Created idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
    get:
      operationId: listIdeas
      tags: [ideas]
      summary: List ideas for a subject
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
  /ideas/{ideaId}:
    patch:
      operationId: updateIdea
      tags: [ideas]
      summary: Edit an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaUpdate"
      responses:
        "200":
          description: Updated idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
    delete:
      operationId: deleteIdea
      tags: [ideas]
      summary: Delete an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      responses:
        "204":
          description: Deleted
  /ideas/{ideaId}/chat:
    get:
      operationId: listIdeaChatMessages
      tags: [idea-chat]
      summary: List the persistent AI chat for an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdeaChatMessage"
    delete:
      operationId: clearIdeaChat
      tags: [idea-chat]
      summary: Clear the AI chat for an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      responses:
        "204":
          description: Chat cleared
  /ideas/{ideaId}/chat/messages:
    post:
      operationId: sendIdeaChatMessage
      tags: [idea-chat]
      summary: Send a message about an idea
      parameters:
        - $ref: "#/components/parameters/IdeaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaChatMessageInput"
      responses:
        "201":
          description: User and assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaChatExchange"
  /subjects/{subjectId}/compile:
    post:
      operationId: compileSubject
      tags: [compilation]
      summary: Compile a subject's ideas into a draft
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompilationInput"
      responses:
        "200":
          description: Compiled draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compilation"
  /subjects/{subjectId}/compilations:
    get:
      operationId: listSubjectCompilations
      tags: [compilation]
      summary: List every compiled draft for a subject
      parameters:
        - $ref: "#/components/parameters/SubjectId"
      responses:
        "200":
          description: Compiled drafts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compilation"
  /subjects/{subjectId}/compilations/{compilationId}:
    patch:
      operationId: updateSubjectCompilation
      tags: [compilation]
      summary: Update a compiled draft
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/CompilationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompilationUpdate"
      responses:
        "200":
          description: Updated compiled draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compilation"
        "404":
          description: Compiled draft not found
    delete:
      operationId: deleteSubjectCompilation
      tags: [compilation]
      summary: Delete a compiled draft
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/CompilationId"
      responses:
        "204":
          description: Deleted
  /subjects/{subjectId}/compilations/{compilationId}/download:
    post:
      operationId: downloadSubjectCompilation
      tags: [compilation]
      summary: Download a compiled draft as PDF or DOCX
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/CompilationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompilationDownloadInput"
      responses:
        "200":
          description: Generated document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "404":
          description: Compiled draft not found
  /transcriptions:
    post:
      operationId: transcribeAudio
      tags: [transcription]
      summary: Convert a voice recording to text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionInput"
      responses:
        "200":
          description: Audio transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
  /note-translations:
    post:
      operationId: translateNote
      tags: [translation]
      summary: Translate an attachment note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteTranslationInput"
      responses:
        "200":
          description: Translated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteTranslation"
  /youtube-transcripts:
    post:
      operationId: extractYoutubeTranscript
      tags: [transcription]
      summary: Extract captions from a YouTube video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeTranscriptInput"
      responses:
        "200":
          description: YouTube transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeTranscript"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: All tasks, found in recordings or added by hand
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Add a task by hand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: The new task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Change, tick off, or reschedule a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Remove a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
  /tasks/scan:
    post:
      operationId: scanTasks
      tags: [tasks]
      summary: Look for tasks in recordings that have text but were not searched yet (a few at a time)
      responses:
        "200":
          description: How many were searched and found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskScan"
  /audio-library/{itemId}/tasks:
    post:
      operationId: findRecordingTasks
      tags: [tasks]
      summary: Find the tasks in one recording (again)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "200":
          description: The tasks found in it
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
  /related:
    get:
      operationId: getRelated
      tags: [search]
      summary: Recordings, ideas and drafts closest in meaning to one
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [recording, idea]
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Related items, closest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedItem"
  /connections:
    get:
      operationId: getConnections
      tags: [search]
      summary: Suggested notebooks for recordings that aren't in one yet
      responses:
        "200":
          description: Groups to make into notebooks, and recordings that fit an existing notebook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connections"
  /digest:
    get:
      operationId: getDigest
      tags: [search]
      summary: This week's digest, if it has been made
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: -840
            maximum: 840
      responses:
        "200":
          description: The digest (or null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestResponse"
    post:
      operationId: makeDigest
      tags: [search]
      summary: Make (or remake) this week's digest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DigestInput"
      responses:
        "200":
          description: The digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestResponse"
  /compilations/{compilationId}/visuals:
    get:
      operationId: listCompilationVisuals
      tags: [visuals]
      summary: The visuals made from a draft
      parameters:
        - $ref: "#/components/parameters/CompilationVisualsId"
      responses:
        "200":
          description: Visuals, in the draft's order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visual"
  /compilations/{compilationId}/visuals/plan:
    post:
      operationId: planCompilationVisuals
      tags: [visuals]
      summary: The AI reads the draft and makes visuals (pictures are drawn in the background)
      parameters:
        - $ref: "#/components/parameters/CompilationVisualsId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualPlanInput"
      responses:
        "201":
          description: The new visuals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visual"
  /visuals/{visualId}:
    patch:
      operationId: updateVisual
      tags: [visuals]
      summary: Change a visual's words, or keep the picture of a diagram
      parameters:
        - $ref: "#/components/parameters/VisualId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualUpdate"
      responses:
        "200":
          description: The visual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visual"
    delete:
      operationId: deleteVisual
      tags: [visuals]
      summary: Remove a visual
      parameters:
        - $ref: "#/components/parameters/VisualId"
      responses:
        "204":
          description: Removed
  /visuals/{visualId}/restore:
    post:
      operationId: restoreVisual
      tags: [visuals]
      summary: Go back to an earlier version (the current one is kept as a version)
      parameters:
        - $ref: "#/components/parameters/VisualId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualRestoreInput"
      responses:
        "200":
          description: The visual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visual"
  /visuals/{visualId}/redo:
    post:
      operationId: redoVisual
      tags: [visuals]
      summary: Make a visual again, optionally with a wish or another style
      parameters:
        - $ref: "#/components/parameters/VisualId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualRedoInput"
      responses:
        "200":
          description: The visual (a picture comes back as drawing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visual"
  /books:
    get:
      operationId: listBooks
      tags: [books]
      summary: Handwriting books (and meeting notebooks), all or those of one subject or recording
      parameters:
        - name: subjectId
          in: query
          required: false
          schema:
            type: integer
        - name: libraryItemId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Books, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookSummary"
    post:
      operationId: createBook
      tags: [books]
      summary: Start a new book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "201":
          description: The new book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
  /books/{bookId}:
    get:
      operationId: getBook
      tags: [books]
      summary: One book with its pages
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
    patch:
      operationId: updateBook
      tags: [books]
      summary: Rename a book, change its cover, or move it to another subject or recording
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
    delete:
      operationId: deleteBook
      tags: [books]
      summary: Delete a book (and its entry in the subject)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204":
          description: Deleted
  /books/{bookId}/pages:
    put:
      operationId: saveBookPages
      tags: [books]
      summary: Save the book's pages
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingNotebookInput"
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
  /books/{bookId}/read:
    post:
      operationId: readBookHandwriting
      tags: [books]
      summary: Read the handwriting on the book's pages as text
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: The book, with the handwriting read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: Recorded meetings, newest first
      responses:
        "200":
          description: Meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingSummary"
  /meetings/{meetingId}:
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: A meeting with its transcript, speakers and minutes
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: The meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
    patch:
      operationId: updateMeeting
      tags: [meetings]
      summary: Rename the meeting or its speakers, or change its notebook
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingUpdate"
      responses:
        "200":
          description: The meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /meetings/{meetingId}/notes:
    put:
      operationId: saveMeetingNotes
      tags: [meetings]
      summary: Save the meeting notepad (notes, photos, documents, drawings)
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingNotesInput"
      responses:
        "200":
          description: The meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /meetings/{meetingId}/notebook:
    put:
      operationId: saveMeetingNotebook
      tags: [meetings]
      summary: Save the meeting's handwriting notebook
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingNotebookInput"
      responses:
        "200":
          description: The meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /meetings/{meetingId}/notebook/read:
    post:
      operationId: readMeetingHandwriting
      tags: [meetings]
      summary: Read the handwriting on the notebook's pages as text
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: The meeting, with the handwriting read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /meetings/{meetingId}/process:
    post:
      operationId: processMeeting
      tags: [meetings]
      summary: Make (or remake) the meeting's text and minutes
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingProcessInput"
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /meetings/{meetingId}/ask:
    post:
      operationId: askMeeting
      tags: [meetings]
      summary: Ask a question about this meeting
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: The answer, citing moments as [m:ss]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAnswer"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [search]
      summary: Home dashboard - activity, streak, where you left off, and an older idea brought back
      parameters:
        - name: offset
          in: query
          required: false
          description: Minutes the person's time zone is ahead of UTC (e.g. 240 for UTC+4).
          schema:
            type: integer
            minimum: -840
            maximum: 840
        - name: shuffle
          in: query
          required: false
          description: Show a different older idea than today's.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
      responses:
        "200":
          description: The dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /ask:
    post:
      operationId: askLibrary
      tags: [search]
      summary: Ask a question about your recordings, ideas and drafts
      description: Answers from your own content with numbered sources; recordings link to the moment they were said.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: The answer and its sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAnswer"
        "400":
          description: No question
  /search:
    get:
      operationId: searchWorkspace
      tags: [search]
      summary: Search ideas, transcripts, notebooks, and drafts
      description: Case-insensitive; Arabic letter variants and diacritics are treated as equivalent.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        "200":
          description: Matches, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Query too short or too long
  /audio-library:
    get:
      operationId: listAudioLibrary
      tags: [audio-library]
      summary: List every recording in the audio library, newest first
      responses:
        "200":
          description: Library items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AudioLibraryItem"
    post:
      operationId: addToAudioLibrary
      tags: [audio-library]
      summary: Add an idea's audio attachment to the library (for example, after removing it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioLibraryAdd"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "200":
          description: Already in the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "404":
          description: Idea or audio attachment not found
  /audio-library/recordings:
    post:
      operationId: createLibraryRecording
      tags: [audio-library]
      summary: Save an uploaded recording straight into the library, without an idea in any subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryRecordingInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "200":
          description: Already saved (a retried upload)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "400":
          description: Not a recording stored in this app
  /audio-library/episodes:
    post:
      operationId: buildEpisode
      tags: [audio-library]
      summary: Script to Episode - join recorded sections into one polished recording with chapters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeInput"
      responses:
        "201":
          description: The episode, saved in the audio library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/transcription:
    post:
      operationId: transcribeLibraryItem
      tags: [audio-library]
      summary: Convert a library recording to text, keeping the spoken language
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryTranscriptionInput"
      responses:
        "200":
          description: Transcribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "404":
          description: Not in the library
        "422":
          description: No speech detected, or the audio could not be read
  /audio-library/join:
    post:
      operationId: joinAudioLibraryItems
      tags: [audio-library]
      summary: Join recordings, in the given order, into one new library recording
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioJoinInput"
      responses:
        "201":
          description: The new joined recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/edit:
    post:
      operationId: editAudioLibraryItem
      tags: [audio-library]
      summary: Keep only the given parts of a recording; the original is kept for restoring
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioEditInput"
      responses:
        "200":
          description: Edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/words:
    post:
      operationId: getAudioLibraryWords
      tags: [audio-library]
      summary: Every word of the recording with its start and end time (fetched once, then stored)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryTranscriptionInput"
      responses:
        "200":
          description: Words with timings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryWords"
        "404":
          description: Not in the library
  /audio-library/{itemId}/enhance:
    post:
      operationId: enhanceAudioLibraryItem
      tags: [audio-library]
      summary: Reduce background noise and even out loudness; the original is kept for restoring
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioEnhanceInput"
      responses:
        "200":
          description: Improved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/sound-lab:
    post:
      operationId: soundLabAudioLibraryItem
      tags: [audio-library]
      summary: Apply Sound lab settings (noise, hum, bands, boxes, volume) to the whole recording; the original is kept for restoring
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoundLabSettings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/sound-lab/preview:
    post:
      operationId: previewSoundLabAudioLibraryItem
      tags: [audio-library]
      summary: Render a short stretch with the given settings, to compare before saving (nothing is saved)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoundLabPreviewInput"
      responses:
        "200":
          description: The processed stretch as MP3
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
  /audio-library/{itemId}/mix:
    post:
      operationId: mixAudioLibraryItem
      tags: [audio-library]
      summary: Add background music to a recording; saves the mix as a new library item (the recording is unchanged)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MixInput"
      responses:
        "201":
          description: The new recording with music
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/subjects:
    post:
      operationId: addAudioLibraryItemToSubject
      tags: [audio-library]
      summary: Add this recording to a subject (as a voice idea). Adding it again to the same subject does nothing.
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioLibrarySubjectInput"
      responses:
        "200":
          description: The recording, with the subjects it is in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/subjects/{subjectId}/remove:
    post:
      operationId: removeAudioLibraryItemFromSubject
      tags: [audio-library]
      summary: Take this recording out of a subject; it stays in the audio library
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The recording, with the subjects it is still in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/mix/remove:
    post:
      operationId: removeAudioLibraryMix
      tags: [audio-library]
      summary: Remove the background music; the recording goes back to the voice as it was before
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "200":
          description: The recording without music
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/mix/preview:
    post:
      operationId: previewMixAudioLibraryItem
      tags: [audio-library]
      summary: Render a short stretch of the mix to listen to before saving (nothing is saved)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MixPreviewInput"
      responses:
        "200":
          description: The mixed stretch as MP3
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
  /audio-library/{itemId}/chapters:
    post:
      operationId: makeAudioLibraryChapters
      tags: [audio-library]
      summary: AI chapters (topic titles with start times) and a short summary, in the recording's language
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "200":
          description: The item with chapters and summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
  /audio-library/{itemId}/peaks:
    get:
      operationId: getAudioLibraryPeaks
      tags: [audio-library]
      summary: The mini waveform of a recording (made once, then stored)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "200":
          description: Loudness of 64 equal slices, 0–1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioPeaks"
  /audio-library/{itemId}/export:
    get:
      operationId: exportAudioLibraryItem
      tags: [audio-library]
      summary: Download the recording converted to another format (the stored recording is unchanged)
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [mp3, wav, m4a, ogg, opus, flac]
        - name: quality
          in: query
          required: false
          schema:
            type: string
            enum: [standard, high, best]
            default: high
      responses:
        "200":
          description: The converted audio file
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "404":
          description: Not in the library
  /audio-library/{itemId}/restore:
    post:
      operationId: restoreAudioLibraryItem
      tags: [audio-library]
      summary: Undo all edits and go back to the original recording
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "409":
          description: Not edited
  /audio-library/{itemId}:
    patch:
      operationId: updateAudioLibraryItem
      tags: [audio-library]
      summary: Rename an item or record its measured length
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioLibraryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioLibraryItem"
        "404":
          description: Not found
    delete:
      operationId: deleteAudioLibraryItem
      tags: [audio-library]
      summary: Remove an item from the library only; the idea and its audio are untouched
      parameters:
        - $ref: "#/components/parameters/AudioLibraryItemId"
      responses:
        "204":
          description: Removed from the library
        "404":
          description: Not found
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
components:
  parameters:
    CompilationVisualsId:
      name: compilationId
      in: path
      required: true
      schema:
        type: integer
    VisualId:
      name: visualId
      in: path
      required: true
      schema:
        type: integer
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: integer
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: integer
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: integer
    IdeaId:
      name: ideaId
      in: path
      required: true
      schema:
        type: integer
    AudioLibraryItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    CompilationId:
      name: compilationId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
        purpose:
          type: string
          enum: [compiled-draft-image]
        compilationId:
          type: integer
          minimum: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Where to PUT the file. For this app's own storage it is a path on the same site as the page.
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    TranscriptionInput:
      type: object
      required: [audioBase64, mimeType, language]
      properties:
        audioBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
        language:
          type: string
          enum: [en, ar]
    Transcription:
      type: object
      required: [text]
      properties:
        text:
          type: string
    NoteTranslationInput:
      type: object
      required: [text, targetLanguage]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
        targetLanguage:
          type: string
          enum: [en, ar]
    NoteTranslation:
      type: object
      required: [text, language]
      properties:
        text:
          type: string
        language:
          type: string
          enum: [en, ar]
    YoutubeTranscriptInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    YoutubeTranscript:
      type: object
      required: [text]
      properties:
        text:
          type: string
    SearchIdeaHit:
      type: object
      required: [id, subjectId, subjectTitle, source, snippet, matchedIn, createdAt]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        subjectTitle:
          type: string
        source:
          type: string
        snippet:
          type: string
          description: Text around the first match.
        matchedIn:
          type: string
          enum: [content, transcript, note, attachment]
        createdAt:
          type: string
          format: date-time
    SearchSubjectHit:
      type: object
      required: [id, title, snippet, ideaCount]
      properties:
        id:
          type: integer
        title:
          type: string
        snippet:
          type: string
        ideaCount:
          type: integer
    SearchDraftHit:
      type: object
      required: [id, subjectId, subjectTitle, tone, snippet, updatedAt]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        subjectTitle:
          type: string
        tone:
          type: string
        snippet:
          type: string
        updatedAt:
          type: string
          format: date-time
    RelatedItem:
      type: object
      required: [kind, id, title, subjectId, subjectTitle, url, score]
      properties:
        kind:
          type: string
          enum: [recording, idea, draft]
        id:
          type: integer
        title:
          type: string
        subjectId:
          type: ["integer", "null"]
        subjectTitle:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        score:
          type: number
    ConnectionItem:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
        title:
          type: string
    ConnectionGroup:
      type: object
      required: [key, title, icon, items]
      properties:
        key:
          type: string
          description: Stays the same for the same recordings (for "not now").
        title:
          type: string
        icon:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionItem"
    ConnectionFiling:
      type: object
      required: [itemId, itemTitle, subjectId, subjectTitle, subjectIcon]
      properties:
        itemId:
          type: integer
        itemTitle:
          type: string
        subjectId:
          type: integer
        subjectTitle:
          type: string
        subjectIcon:
          type: ["string", "null"]
    Connections:
      type: object
      required: [groups, filings, ready]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionGroup"
        filings:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionFiling"
        ready:
          type: boolean
          description: False while the meaning index is still being built (or AI is off).
    DigestTheme:
      type: object
      required: [title, summary]
      properties:
        title:
          type: string
        summary:
          type: string
    DigestReady:
      type: object
      required: [subjectId, subjectTitle, reason]
      properties:
        subjectId:
          type: integer
        subjectTitle:
          type: string
        reason:
          type: string
    Digest:
      type: object
      required: [headline, themes, questions, ready, nudge]
      properties:
        headline:
          type: string
        themes:
          type: array
          items:
            $ref: "#/components/schemas/DigestTheme"
        questions:
          type: array
          items:
            type: string
        ready:
          type: array
          items:
            $ref: "#/components/schemas/DigestReady"
        nudge:
          type: ["string", "null"]
    DigestResponse:
      type: object
      required: [week, digest, createdAt, items]
      properties:
        week:
          type: string
        digest:
          oneOf:
            - $ref: "#/components/schemas/Digest"
            - type: "null"
        createdAt:
          type: ["string", "null"]
        items:
          type: integer
          description: How many recordings and ideas this week (a digest needs a few).
    DigestInput:
      type: object
      properties:
        offset:
          type: integer
          minimum: -840
          maximum: 840
        language:
          type: string
          enum: [en, ar]
    EpisodeSection:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
          maxLength: 120
        url:
          type: string
          minLength: 1
    EpisodeInput:
      type: object
      required: [title, sections]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        script:
          type: string
          maxLength: 60000
          description: The script that was read, for the show notes.
        sections:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/EpisodeSection"
        clean:
          type: boolean
          description: Reduce noise and level the voice (default true).
        tighten:
          type: boolean
          description: Shorten long pauses (default true).
    MeetingMarker:
      type: object
      required: [at, kind]
      properties:
        at:
          type: number
          minimum: 0
        kind:
          type: string
          enum: [important, decision, action, question]
    MeetingStart:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        subjectId:
          type: ["integer", "null"]
        participants:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 80
        agenda:
          type: string
          maxLength: 4000
        markers:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/MeetingMarker"
        notes:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/MeetingNote"
        notebook:
          $ref: "#/components/schemas/NotebookDoc"
    NotebookDoc:
      type: object
      description: The handwriting notebook - pages of ink strokes, typed text and media (checked on the server).
      required: [version, pages]
      additionalProperties: true
      properties:
        version:
          type: integer
        pages:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: true
    MeetingNotebookInput:
      type: object
      required: [notebook]
      properties:
        notebook:
          $ref: "#/components/schemas/NotebookDoc"
    Visual:
      type: object
      required: [id, compilationId, kind, title, caption, why, anchor, style, spec, status, imageUrl, error, history, createdAt]
      properties:
        id:
          type: integer
        compilationId:
          type: integer
        kind:
          type: string
          enum: [picture, concept, steps, timeline, compare, chart, facts]
        title:
          type: string
        caption:
          type: string
        why:
          type: string
        anchor:
          type: string
          description: A few words of the draft this visual belongs after.
        style:
          type: string
        spec:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ready, drawing, failed]
        imageUrl:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        history:
          type: array
          description: Earlier versions, newest last.
          items:
            $ref: "#/components/schemas/VisualVersion"
        createdAt:
          type: string
    VisualVersion:
      type: object
      required: [imageUrl, title, note, at]
      properties:
        imageUrl:
          type: ["string", "null"]
        title:
          type: string
        note:
          type: string
          description: The change that came after this version.
        at:
          type: string
    VisualRestoreInput:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
    VisualPlanInput:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          minItems: 1
          items:
            type: string
            enum: [picture, concept, steps, timeline, compare, chart, facts]
        style:
          type: string
          maxLength: 20
        audience:
          type: string
          maxLength: 20
        language:
          type: string
          enum: [auto, ar, en]
        count:
          type: integer
          minimum: 1
          maximum: 8
        request:
          type: string
          maxLength: 500
          description: The user's own idea for one visual.
    VisualRedoInput:
      type: object
      properties:
        wish:
          type: string
          maxLength: 1000
        mode:
          type: string
          enum: [retouch, redraw]
          description: "Pictures: retouch keeps the picture and changes what is asked; redraw draws it again."
        prompt:
          type: string
          maxLength: 2000
          description: A picture's full drawing description, rewritten by the user.
        style:
          type: string
          maxLength: 20
    VisualUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        caption:
          type: string
          maxLength: 300
        imageUrl:
          type: string
          maxLength: 300
    BookSummary:
      type: object
      required: [id, kind, title, cover, subjectId, subjectTitle, libraryItemId, audioTitle, meetingId, ideaId, pageCount, writtenCount, preview, paper, paperColor, updatedAt]
      properties:
        id:
          type: integer
          description: The book's id (for a meeting notebook, the meeting's id).
        kind:
          type: string
          enum: [subject, audio, meeting, loose]
        title:
          type: string
        cover:
          type: string
        subjectId:
          type: ["integer", "null"]
        subjectTitle:
          type: ["string", "null"]
        libraryItemId:
          type: ["integer", "null"]
        audioTitle:
          type: ["string", "null"]
        meetingId:
          type: ["integer", "null"]
        ideaId:
          type: ["integer", "null"]
          description: The book's entry in its subject (or the meeting's).
        pageCount:
          type: integer
        writtenCount:
