          type: string
        note:
          type: string
        transcript:
          type: string
        extractedText:
          type: string
        durationSeconds:
          type: integer
          minimum: 0
          description: Length of an audio recording, when known.
        marks:
          type: array
          maxItems: 100
          description: Seconds where "Mark" was tapped while recording.
          items:
            type: number
            minimum: 0
        libraryItemId:
          type: integer
          description: The audio library recording this audio came from (kept in step with it).
        awaitingText:
          type: boolean
          description: The idea's text will be filled in when the recording's transcript is ready.
    Idea:
      type: object
      required: [id, subjectId, content, source, attachments, createdAt]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        content:
          type: string
        source:
          type: string
          enum: [text, voice, image, video, audio, pdf, document, link]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAttachment"
        createdAt:
          type: string
          format: date-time
    IdeaChatMessage:
      type: object
      required: [id, ideaId, role, content, createdAt]
      properties:
        id:
          type: integer
        ideaId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    IdeaChatMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
    IdeaChatExchange:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: "#/components/schemas/IdeaChatMessage"
        assistantMessage:
          $ref: "#/components/schemas/IdeaChatMessage"
    IdeaInput:
      type: object
      required: [content]
      properties:
        clientCaptureId:
          type: string
          format: uuid
          description: Stable recording ID for idempotent retries.
        capturedAt:
          type: string
          format: date-time
          description: Original capture time for delayed uploads.
        content:
          type: string
          minLength: 1
        source:
          type: string
          enum: [text, voice, image, video, audio, pdf, document, link]
          default: text
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAttachment"
          default: []
    IdeaUpdate:
      type: object
      properties:
        subjectId:
          type: integer
          minimum: 1
          description: Move the idea and its attachments to this subject.
        content:
          type: string
          minLength: 1
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAttachment"
    CompilationInput:
      type: object
      properties:
        tone:
          type: string
          enum:
            - clear
            - conversational
            - academic
            - cinematic
            - newspaper_article
            - advertisement
            - discussion_invitation
            - official_letter
            - masters_proposal
            - phd_proposal
            - summary_only
            - objectives_goals
            - youtube_script
            - broadcast_script
          default: clear
    Compilation:
      type: object
      required: [id, subjectId, tone, content, createdAt, updatedAt]
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        tone:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CompilationUpdate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
    CompilationDownloadInput:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [pdf, docx]
