      type: object
      required: [musicStart, regionStart, regionEnd, fit, musicVolume, voiceVolume, fadeIn, fadeOut, duck, makeRoom]
      properties:
        musicStart:
          type: number
          minimum: 0
          description: Where in the song to begin (seconds).
        regionStart:
          type: number
          minimum: -60
          maximum: 86400
          description: Where the music starts, on the recording's clock (negative = an intro before the voice).
        regionEnd:
          type: number
          minimum: -59
          maximum: 86460
          description: Where the music ends, on the recording's clock (past the end = an outro).
        fit:
          type: string
          enum: [loop, stretch, once]
          description: How the song fills the time between start and end.
        musicVolume: { type: number, minimum: -40, maximum: 6 }
        voiceVolume: { type: number, minimum: -12, maximum: 12 }
        fadeIn: { type: number, minimum: 0, maximum: 15 }
        fadeOut: { type: number, minimum: 0, maximum: 15 }
        duck:
          type: integer
          minimum: 0
          maximum: 3
          description: Lower the music while the voice speaks, 0 (off) to 3 (strong).
        makeRoom:
          type: boolean
          description: Dip the music's middle frequencies so words stay clear.
