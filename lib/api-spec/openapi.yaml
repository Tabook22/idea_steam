      type: object
      required: [noise, bands, edits, volume, level, deess]
      properties:
        noise:
          type: integer
          minimum: 0
          maximum: 4
          description: Noise reduction, 0 (off) to 4 (maximum).
        noiseSample:
          type: [object, "null"]
          required: [start, end]
          properties:
            start: { type: number, minimum: 0 }
            end: { type: number, minimum: 0 }
        noiseFloor:
          type: [number, "null"]
          minimum: -120
          maximum: 0
          description: Measured loudness of the background noise (RMS dBFS). Measured on the server when missing.
        hum:
          type: [integer, "null"]
          enum: [50, 60, null]
        bands:
          type: object
          required: [rumble, warmth, voice, presence, air]
          properties:
            rumble: { type: number, minimum: -30, maximum: 12 }
            warmth: { type: number, minimum: -30, maximum: 12 }
            voice: { type: number, minimum: -30, maximum: 12 }
            presence: { type: number, minimum: -30, maximum: 12 }
            air: { type: number, minimum: -30, maximum: 12 }
        edits:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/SoundLabRegionEdit"
        volume: { type: number, minimum: -12, maximum: 12 }
        level: { type: boolean }
        deess: { type: boolean }
