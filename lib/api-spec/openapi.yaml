      type: object
      required: [id, url, title, mimeType, durationSeconds, transcript, sourceIdeaId, sourceSubjectId, sourceSubjectTitle, edited, hasWords, marks, chapters, summary, kind, mix, bakedMusic, subjects, peaks, capturedAt, createdAt]
      properties:
        peaks:
          type: ["array", "null"]
          description: The mini waveform (64 values, 0–1) when already made; otherwise ask /peaks.
          items:
            type: number
        id:
          type: integer
